name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  size:
    # A human adds the size-exception label to let a bigger PR through.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'size-exception') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Under 500 changed lines
        env:
          BASE: ${{ github.base_ref }}
        run: .claude/scripts/pr-size "origin/$BASE"
