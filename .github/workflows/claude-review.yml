name: Claude review

# Reviews a PR when it's opened or marked ready, and answers @claude in PR comments.
# Needs one repository secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`.
# The Claude GitHub app must be installed on the repo: run /install-github-app in Claude Code.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v1.0.290. Pinned to a commit: update the SHA and the version together.
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow .claude/REVIEW.md for what to flag, what to skip and how
            to write findings, and check it against .claude/CLAUDE.md and the decision log it names.
            If the repo has claude-notes/plan.md, the ticket this implements is its section whose ID starts the branch name.

            Review the code and its security in the same pass: input reaching queries, HTML or a
            shell unescaped, missing auth checks, secrets in code, unsafe dependencies.

            Check each finding against the code before posting it. Post findings as inline comments
            on the changed lines, each starting with "🤖 Claude review:" and its severity. Then post
            one summary comment that starts with "🤖 Claude review:" and the count of Important findings.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  respond:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --disallowedTools "Bash(gh pr merge:*)"
